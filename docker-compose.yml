version: "3.9"

services:
  db:
    image: postgres:16
    container_name: aicte_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicte_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-aicte_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicte} -d ${POSTGRES_DB:-aicte_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
